name: LightTracker Plus

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "variants/esp32s3/diy/QRPLabs_LightTracker_Plus_1_0/**"
      - "variants/esp32s3/esp32s3.ini"
      - "boards/QRPLabs_LightTracker_Plus_1_0.json"
      - "platformio.ini"
      - ".github/workflows/lighttracker_plus.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        description: Release tag to publish (e.g. lt-v1). Leave blank to only build.

permissions:
  contents: write

env:
  PIO_ENV: QRPLabs_LightTracker_Plus_1_0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini', 'variants/esp32s3/esp32s3.ini', 'variants/esp32/esp32-common.ini') }}

      # Same pinned tool versions as upstream CI (an unpinned PlatformIO fails the platform's version check)
      - run: pip install -r .github/actions/setup-base/requirements.txt

      # The ESP32 platform builds its own venv (~/.platformio/penv) with "pioarduino>=6.2.0".
      # pioarduino 6.2.0.post1 reports itself as 6.2.0-post.1, which fails the same platform's
      # ">=6.2.0" engine check in the second (Arduino) build pass. Pre-create the venv with 6.2.0;
      # the platform only installs packages that are missing or don't satisfy the spec.
      - name: Pin pioarduino core in the platform venv
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install -q "pioarduino==6.2.0"
          ~/.platformio/penv/bin/pio --version

      - name: Build
        run: ./bin/build-esp32.sh "$PIO_ENV"

      - name: Collect binaries
        run: |
          mkdir -p out
          cp release/*.bin release/*.mt.json release/device-install.* release/device-update.* out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lighttracker-plus
          path: out/*

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" out/* \
            --target "$GITHUB_SHA" \
            --title "Meshtastic LightTracker Plus $TAG" \
            --notes "Meshtastic firmware for QRP Labs LightTracker Plus v1.0 (ESP32-S3 + E22-400M30S). Flash firmware-*.factory.bin at 0x0 for a fresh install, or use the update .bin from an existing Meshtastic install."
